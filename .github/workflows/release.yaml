# release-plz for the stable 0.2 branch

name: Release-plz v0.2

permissions:
  contents: write
  id-token: write

on:
  push:
    branches:
      - libc-0.2

jobs:
  release-plz:
    name: Release-plz v0.2
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust (rustup)
        run: rustup update stable --no-self-update && rustup default stable
      - name: Run release-plz
        uses: release-plz/action@b2baf303c463c223526d52a8a91b0777f052cf3f # v0.5.146
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # FIXME(release): release-pr is broken since we have two release tracks for
          # `libc` :(
          command: release
